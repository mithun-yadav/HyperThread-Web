<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HyperThread</title>
  <desc id="desc">Overlapping speech bubbles with typing dots and an online indicator.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="frontBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="backBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>
    <filter id="backShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="120" cy="100" r="180" fill="#FFFFFF" opacity="0.08"/>
  <g filter="url(#backShadow)">
    <path d="M170 140h200c44 0 80 36 80 80s-36 80-80 80h-20l30 40c6 8 0 18-10 18-6 0-11-3-15-8l-40-50H170c-44 0-80-36-80-80s36-80 80-80Z" fill="url(#backBubbleGrad)"/>
  </g>
  <circle cx="360" cy="220" r="10" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="395" cy="220" r="10" fill="#FFFFFF" opacity="0.9"/>
  <g filter="url(#dropShadow)">
    <path d="M140 210h170c38.66 0 70 31.34 70 70s-31.34 70-70 70H205l-55 55c-6.5 6.5-18 2-18-7v-48h8c-38.66 0-70-31.34-70-70s31.34-70 70-70Z" fill="url(#frontBubbleGrad)"/>
  </g>
  <g fill="#6366F1">
    <circle cx="175" cy="280" r="14"/><circle cx="225" cy="280" r="14"/><circle cx="275" cy="280" r="14"/>
  </g>
  <circle cx="410" cy="102" r="28" fill="#10B981" stroke="#FFFFFF" stroke-width="10"/>
</svg>
